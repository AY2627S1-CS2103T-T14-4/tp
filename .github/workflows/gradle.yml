name: Java CI

on: [push, pull_request]

jobs:
  build:
    timeout-minutes: 15
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Run repository-wide tests
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}/.github
        run: ./run-checks.sh

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Diagnose ClientCardTest on Linux
        if: runner.os == 'Linux'
        run: timeout 120s ./gradlew test --tests "seedu.address.ui.ClientCardTest" --info --console=plain

      - name: Build and check with Gradle
        if: runner.os != 'Linux'
        run: ./gradlew check coverage --info --console=plain
