name: Java CI

on: [push, pull_request]

jobs:
  build:
    timeout-minutes: 15
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Diagnose ClientCardTest on Linux
        if: runner.os == 'Linux'
        run: timeout 120s ./gradlew test --tests "seedu.address.ui.ClientCardTest" --info --console=plain

      - name: Build and check with Gradle
        if: runner.os != 'Linux'
        run: ./gradlew check coverage --info --console=plain