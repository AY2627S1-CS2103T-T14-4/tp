name: Label alpha bugs

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    if: contains(github.event.issue.labels.*.name, 'alpha-bug')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            // Issue forms render each field as "### <label>" followed by the answer.
            const answer = (field) => {
              const match = body.match(new RegExp(`### ${field}\\s+(\\S+)`));
              return match ? match[1] : null;
            };
            const typeLabels = { Bug: 'type.Bug', Enhancement: 'type.Enhancement' };
            const severityLabels = {
              VeryLow: 'severity.VeryLow',
              Low: 'severity.Low',
              Medium: 'severity.Medium',
              High: 'severity.High',
            };
            const labels = [typeLabels[answer('Type')], severityLabels[answer('Severity')]]
              .filter(Boolean);
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels,
              });
            }
